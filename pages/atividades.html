    <style>

        /* =========================================================
           JNFLOW — ATIVIDADES
           PRETO + DOURADO
        ========================================================= */


        /* =========================================================
           TOOLBAR
        ========================================================= */

        .activities-toolbar {
            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                180px
                220px;

            gap: 12px;

            margin-bottom: 18px;
        }

        .activities-toolbar input,
        .activities-toolbar select {
            min-height: 44px;

            border-color:
                rgba(212, 175, 55, 0.14);

            background:
                rgba(14, 14, 14, 0.92);
        }

        .activities-toolbar input:hover,
        .activities-toolbar select:hover {
            border-color:
                rgba(212, 175, 55, 0.28);
        }


        /* =========================================================
           RESUMO
        ========================================================= */

        .activities-summary {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 12px;

            margin-bottom: 14px;

            color:
                var(--text-secondary);

            font-size: 12px;
        }

        .activities-summary strong {
            color:
                var(--primary);
        }


        /* =========================================================
           LISTA
        ========================================================= */

        .activities-list {
            display: grid;

            gap: 12px;
        }


        /* =========================================================
           CARD
        ========================================================= */

        .activity-card {
            position: relative;

            display: grid;

            grid-template-columns:
                74px
                minmax(0, 1fr)
                auto;

            gap: 16px;

            align-items: center;

            overflow: hidden;

            padding: 16px;

            border:
                1px solid
                rgba(212, 175, 55, 0.13);

            border-radius: 15px;

            background:
                linear-gradient(
                    180deg,
                    rgba(17, 17, 17, 0.97),
                    rgba(10, 10, 10, 0.99)
                );

            box-shadow:
                0 12px 30px
                rgba(0, 0, 0, 0.18);

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .activity-card::before {
            content: "";

            position: absolute;

            left: 0;
            top: 14px;
            bottom: 14px;

            width: 2px;

            border-radius:
                0 4px 4px 0;

            background:
                linear-gradient(
                    180deg,
                    transparent,
                    rgba(212, 175, 55, 0.72),
                    transparent
                );

            opacity: 0;

            transition:
                opacity 0.2s ease;
        }

        .activity-card:hover {
            border-color:
                rgba(212, 175, 55, 0.30);

            background:
                linear-gradient(
                    180deg,
                    rgba(22, 19, 13, 0.98),
                    rgba(11, 10, 8, 0.99)
                );

            transform:
                translateY(-2px);

            box-shadow:
                0 18px 40px
                rgba(0, 0, 0, 0.28);
        }

        .activity-card:hover::before {
            opacity: 1;
        }


        /* =========================================================
           DATA
        ========================================================= */

        .activity-card-date {
            width: 64px;
            min-height: 64px;

            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            border:
                1px solid
                rgba(212, 175, 55, 0.22);

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    rgba(212, 175, 55, 0.12),
                    rgba(154, 116, 28, 0.07)
                );

            box-shadow:
                inset 0 0 18px
                rgba(212, 175, 55, 0.025);
        }

        .activity-card-date strong {
            font-size: 22px;

            color:
                var(--primary);
        }

        .activity-card-date span {
            margin-top: 2px;

            font-size: 9px;
            font-weight: 800;

            color:
                #f0d77a;

            letter-spacing:
                0.05em;

            text-transform:
                uppercase;
        }


        /* =========================================================
           CONTEÚDO
        ========================================================= */

        .activity-card-content {
            min-width: 0;
        }

        .activity-card-title-row {
            display: flex;

            align-items: center;
            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 7px;
        }

        .activity-card-title {
            color:
                var(--text-primary);

            font-size: 15px;
            font-weight: 800;
        }


        /* =========================================================
           CATEGORIA
        ========================================================= */

        .activity-card-category {
            padding:
                4px
                8px;

            border:
                1px solid
                rgba(212, 175, 55, 0.12);

            border-radius:
                999px;

            background:
                rgba(212, 175, 55, 0.08);

            color:
                var(--primary);

            font-size: 9px;
            font-weight: 800;
        }


        /* =========================================================
           META
        ========================================================= */

        .activity-card-meta {
            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            color:
                var(--text-secondary);

            font-size: 11px;
        }

        .activity-card-meta span {
            display: inline-flex;

            align-items: center;

            gap: 4px;
        }


        /* =========================================================
           COBERTURA
        ========================================================= */

        .activity-card-coverage {
            margin-top: 8px;

            display: inline-flex;

            padding:
                5px
                8px;

            border:
                1px solid
                rgba(212, 175, 55, 0.11);

            border-radius: 8px;

            background:
                linear-gradient(
                    90deg,
                    rgba(212, 175, 55, 0.08),
                    rgba(154, 116, 28, 0.05)
                );

            color:
                #e2c45a;

            font-size: 10px;
            font-weight: 700;
        }


        /* =========================================================
           AÇÕES
        ========================================================= */

        .activity-card-actions {
            display: flex;

            flex-direction: column;

            align-items: flex-end;

            gap: 8px;
        }

        .activity-action-buttons {
            display: flex;

            gap: 7px;
        }

        .activity-action-btn {
            min-height: 36px;

            padding:
                0
                11px;

            border:
                1px solid
                var(--border);

            border-radius: 9px;

            background:
                var(--surface-soft);

            color:
                var(--text-primary);

            font-size: 10px;
            font-weight: 700;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease,
                color 0.2s ease;
        }

        .activity-action-btn:hover {
            border-color:
                rgba(212, 175, 55, 0.30);

            background:
                rgba(212, 175, 55, 0.07);

            color:
                #f0d77a;

            transform:
                translateY(-1px);
        }


        /* =========================================================
           CONCLUIR
        ========================================================= */

        .activity-action-btn.complete {
            border-color:
                rgba(74, 222, 128, 0.16);

            background:
                rgba(74, 222, 128, 0.08);

            color:
                #86efac;
        }

        .activity-action-btn.complete:hover {
            border-color:
                rgba(74, 222, 128, 0.30);

            background:
                rgba(74, 222, 128, 0.13);

            color:
                #bbf7d0;
        }


        /* =========================================================
           EXCLUIR
        ========================================================= */

        .activity-action-btn.delete {
            border-color:
                rgba(251, 113, 133, 0.18);

            background:
                rgba(251, 113, 133, 0.08);

            color:
                #fb7185;
        }

        .activity-action-btn.delete:hover {
            border-color:
                rgba(251, 113, 133, 0.34);

            background:
                rgba(251, 113, 133, 0.13);

            color:
                #fda4af;
        }


        /* =========================================================
           LIGHT MODE
        ========================================================= */

        [data-theme="light"]
        .activities-toolbar input,

        [data-theme="light"]
        .activities-toolbar select {
            background:
                #ffffff;

            color:
                #171717;
        }


        [data-theme="light"]
        .activity-card {
            background:
                #ffffff;

            border-color:
                rgba(154, 116, 28, 0.14);

            box-shadow:
                0 12px 28px
                rgba(42, 33, 15, 0.05);
        }


        [data-theme="light"]
        .activity-card:hover {
            background:
                #fffdf8;

            border-color:
                rgba(154, 116, 28, 0.28);
        }


        [data-theme="light"]
        .activity-card-date {
            background:
                linear-gradient(
                    135deg,
                    rgba(212, 175, 55, 0.12),
                    rgba(154, 116, 28, 0.05)
                );
        }


        [data-theme="light"]
        .activity-card-coverage {
            background:
                #faf6eb;

            color:
                #8c6716;
        }


        /* =========================================================
           TABLET
        ========================================================= */

        @media (max-width: 900px) {

            .activities-toolbar {
                grid-template-columns:
                    1fr;
            }

            .activity-card {
                grid-template-columns:
                    64px
                    1fr;
            }

            .activity-card-actions {
                grid-column:
                    2;

                align-items:
                    flex-start;
            }
        }


        /* =========================================================
           MOBILE
           SOMENTE ALTERA MOBILE
        ========================================================= */

        @media (max-width: 768px) {


            /* =====================================================
               CABEÇALHO
            ===================================================== */

            .activities-page-header
            .topbar-actions {
                display: none;
            }


            /* =====================================================
               PAINEL
            ===================================================== */

            .activities-panel {
                padding:
                    14px;

                border-radius:
                    16px;
            }


            /* =====================================================
               FILTROS
            ===================================================== */

            .activities-toolbar {
                display: grid;

                grid-template-columns:
                    1fr;

                gap: 9px;

                margin-bottom:
                    15px;
            }


            .activities-toolbar input,
            .activities-toolbar select {
                width: 100%;

                min-height: 44px;

                padding:
                    0 13px;

                border-radius:
                    10px;

                font-size:
                    12px;
            }


            /* =====================================================
               RESUMO
            ===================================================== */

            .activities-summary {
                margin:
                    0
                    0
                    13px;

                font-size:
                    10px;
            }


            /* =====================================================
               LISTA
            ===================================================== */

            .activities-list {
                gap: 10px;
            }


            /* =====================================================
               CARD MOBILE
            ===================================================== */

            .activity-card {
                display: grid;

                grid-template-columns:
                    58px
                    minmax(0, 1fr);

                gap:
                    12px;

                align-items:
                    start;

                padding:
                    14px;

                border-radius:
                    15px;

                transform:
                    none !important;
            }


            /*
               No mobile não precisamos
               do hover de desktop.
            */

            .activity-card:hover {
                transform:
                    none;

                box-shadow:
                    0 12px 30px
                    rgba(0, 0, 0, 0.18);
            }


            .activity-card::before {
                top: 12px;
                bottom: 12px;

                opacity:
                    0.55;
            }


            /* =====================================================
               DATA
            ===================================================== */

            .activity-card-date {
                width: 56px;

                min-height: 58px;

                border-radius:
                    13px;
            }

            .activity-card-date strong {
                font-size:
                    20px;
            }

            .activity-card-date span {
                font-size:
                    8px;
            }


            /* =====================================================
               CONTEÚDO
            ===================================================== */

            .activity-card-content {
                padding-top:
                    2px;
            }

            .activity-card-title-row {
                gap: 6px;

                margin-bottom:
                    7px;
            }

            .activity-card-title {
                font-size:
                    14px;

                line-height:
                    1.25;
            }


            /* =====================================================
               CATEGORIA
            ===================================================== */

            .activity-card-category {
                padding:
                    3px
                    7px;

                font-size:
                    7.5px;
            }


            /* =====================================================
               META
            ===================================================== */

            .activity-card-meta {
                gap:
                    6px
                    9px;

                font-size:
                    9px;

                line-height:
                    1.4;
            }


            .activity-card-meta span {
                min-width: 0;
            }


            /* =====================================================
               COBERTURA
            ===================================================== */

            .activity-card-coverage {
                max-width:
                    100%;

                margin-top:
                    7px;

                padding:
                    4px
                    7px;

                overflow:
                    hidden;

                font-size:
                    8px;

                text-overflow:
                    ellipsis;

                white-space:
                    nowrap;
            }


            /* =====================================================
               AÇÕES
            ===================================================== */

            .activity-card-actions {
                grid-column:
                    1 / -1;

                width:
                    100%;

                display:
                    grid;

                gap:
                    8px;

                align-items:
                    stretch;

                margin-top:
                    3px;
            }


            /*
               O status continua acima
               dos botões.
            */

            .activity-card-actions
            .status {
                justify-self:
                    stretch;

                width:
                    100%;

                text-align:
                    center;

                font-size:
                    8px;
            }


            .activity-action-buttons {
                width:
                    100%;

                display:
                    grid;

                grid-template-columns:
                    repeat(
                        3,
                        minmax(0, 1fr)
                    );

                gap:
                    7px;
            }


            .activity-action-btn {
                width:
                    100%;

                min-width:
                    0;

                min-height:
                    40px;

                padding:
                    0
                    6px;

                display:
                    flex;

                align-items:
                    center;

                justify-content:
                    center;

                border-radius:
                    9px;

                font-size:
                    9px;

                white-space:
                    nowrap;
            }


            /* =====================================================
               TOUCH
            ===================================================== */

            .activity-action-btn:active {
                transform:
                    scale(0.97);
            }
        }


        /* =========================================================
           IPHONE / 430px
        ========================================================= */

        @media (max-width: 430px) {

            .activities-panel {
                padding:
                    12px;
            }


            .activity-card {
                grid-template-columns:
                    54px
                    minmax(0, 1fr);

                gap:
                    10px;

                padding:
                    12px;
            }


            .activity-card-date {
                width:
                    52px;

                min-height:
                    55px;
            }


            .activity-card-date strong {
                font-size:
                    19px;
            }


            .activity-card-title {
                font-size:
                    13px;
            }


            .activity-action-btn {
                min-height:
                    38px;

                font-size:
                    8px;
            }
        }


        /* =========================================================
           MOBILE MUITO PEQUENO
        ========================================================= */

        @media (max-width: 360px) {

            .activity-card {
                grid-template-columns:
                    50px
                    minmax(0, 1fr);
            }


            .activity-card-date {
                width:
                    48px;

                min-height:
                    52px;
            }


            .activity-action-buttons {
                grid-template-columns:
                    1fr;
            }


            .activity-action-btn {
                min-height:
                    42px;
            }
        }

</style>
